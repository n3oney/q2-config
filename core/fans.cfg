[heater_fan hotend_fan]
pin: THR:PA11
max_power: 1.0
shutdown_speed: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
fan_speed: 1.0
off_below: 0
tachometer_pin: THR:PA12
tachometer_ppr: 2
tachometer_poll_interval: 0.0015

[fan_generic cooling_fan]
pin: THR:PA8
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.010
hardware_pwm: False
kick_start_time: 0.100
off_below: 0.0
tachometer_pin: THR:PA9
tachometer_ppr: 2
tachometer_poll_interval: 0.0015

[controller_fan board_fan]
pin: PA9
max_power: 1.0
shutdown_speed: 1.0
cycle_time: 0.01
fan_speed: 1.0
stepper: stepper_z,stepper_z1

[fan_generic auxiliary_cooling_fan]
pin: PB15
shutdown_speed: 0.0
cycle_time: 0.0100
hardware_pwm: false
kick_start_time: 0.100
off_below: 0.0
tachometer_pin: PC4
tachometer_ppr: 2
tachometer_poll_interval: 0.0015
