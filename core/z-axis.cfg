[force_move]
enable_force_move: True

# Z uses the load-cell probe as its endstop (Kalico load_cell_probe provides
# probe:z_virtual_endstop). Stock QIDI reverse-homing (*_reverse keys) removed.
[stepper_z]
step_pin: PC10
dir_pin: PA15
enable_pin: !PC11
microsteps: 128
rotation_distance: 4
full_steps_per_rotation: 200
endstop_pin: probe:z_virtual_endstop
position_max: 265
position_min: -5
homing_speed: 10
second_homing_speed: 5
homing_retract_dist: 10.0
homing_positive_dir: false

[stepper_z1]
step_pin: PB1
dir_pin: PB6
enable_pin: !PB0
microsteps: 128
rotation_distance: 4
full_steps_per_rotation: 200

[z_tilt]
z_positions:
    -15,137
    285,137
points:
    10,137
    260,137
speed: 150
horizontal_move_z: 5
retries: 2
retry_tolerance: 0.05

[tmc2209 stepper_z1]
uart_pin: PB7
run_current: 1.07
sense_resistor: 0.110
interpolate: True
stealthchop_threshold: 9999999999
diag_pin: ^PA14
driver_SGTHRS: 140

[tmc2209 stepper_z]
uart_pin: PC5
run_current: 1.07
sense_resistor: 0.110
interpolate: True
stealthchop_threshold: 9999999999
diag_pin: ^PC1
driver_SGTHRS: 140
