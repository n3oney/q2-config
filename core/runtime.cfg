[respond]
default_type: echo

[save_variables]
filename: /home/mks/printer_data/config/saved_variables.cfg

[idle_timeout]
timeout: 43200
gcode:
    M118 Pause Timeout: Turn off heaters
    M106 S0
    M104 S0
    M140 S0
    M141 S0

[pause_resume]

[display_status]

[exclude_object]

[virtual_sdcard]
path: ~/printer_data/gcodes

[gcode_arcs]
resolution: 1.0
