# Homing: sensorless XY (TMC2240 StallGuard). Z is faked until the load
# cell is calibrated (real Z homing via load_cell_probe needs calibration).

[gcode_macro PRINTER_PARAM]
variable_max_x_position: 270.0
variable_max_y_position: 270.0
variable_max_z_position: 260.0
variable_clear_x_position: 88.0
variable_clear_y_position: 287.0
gcode:

[gcode_macro _HOME_X]
gcode:
    # move towards front on Y
    G90
    G0 Y10 F3000

    # actually home X
    G28 X

    # move 10mm away from wall
    G91
    G1 X-10 F3000
    G90



[gcode_macro _HOME_Y]
gcode:
    G28 Y
    
    G91
    G1 Y10 F3000
    G90

[homing_override]
axes: xyz
gcode:
	{% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}

    {% set home_x = home_all or 'X' in params %}
    {% set home_y = home_all or 'Y' in params %}
    {% set home_z = home_all or 'Z' in params %}

    {% set was_x_homed = 'x' in printer.toolhead.homed_axes %}
	{% set was_y_homed = 'y' in printer.toolhead.homed_axes %}
	{% set was_z_homed = 'z' in printer.toolhead.homed_axes %}

    {% set need_x = home_x or (home_z and not was_x_homed) %}
    {% set need_y = home_y or (home_z and not was_y_homed) %}
    {% set x_will_home_y = need_x and 'y' not in printer.toolhead.homed_axes %}

    M204 S10000

    # if z is already homed and we are not re-homing it, just move up by 5mm without resetting it
    {% if not was_z_homed %}
      SET_KINEMATIC_POSITION Z={printer.toolhead.axis_maximum.z/2} SET_HOMED=Z
    {% endif %}

    G91
    G1 Z5 F600
    G90

    # disable extruder cause why not
    SET_STEPPER_ENABLE STEPPER=extruder enable=0


    # if homing X or homing Z (if X not yet homed), home X (which auto homes Y if required)
    {% if need_x %}
        {% if not was_y_homed %}
          _HOME_Y
        {% endif %}
        _HOME_X

        {% if not was_y_homed %}
          _HOME_Y
        {% endif %}
    {% endif %}

	# if homing Y or homing Z (if Y not yet homed), home Y
    {% if need_y and (not need_x or was_y_homed) %}
       _HOME_Y
    {% endif %}

	{% if home_z %}
        # move to center
        G1 X{printer['gcode_macro PRINTER_PARAM'].max_x_position/2} Y{printer['gcode_macro PRINTER_PARAM'].max_y_position/2} F7800
        M400
        # z home!
        G28 Z
        # move away from wall
        G1 Z10 F600
    {% elif not was_z_homed %}
        SET_KINEMATIC_POSITION CLEAR_HOMED=Z SET_HOMED=
    {% endif %}
    G90
