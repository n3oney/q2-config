[gcode_macro _COOLDOWN_STATE]
variable_active: 0
variable_skip: 0
variable_filament: ""
variable_target: 35
variable_chamber_temp: 0
variable_phase: ""
gcode:
  M117
[gcode_macro SKIP_COOLDOWN]
description: Stop the running COOLDOWN without touching print stats.
gcode:
  {% if printer["gcode_macro _COOLDOWN_STATE"].active %}
    SET_GCODE_VARIABLE MACRO=_COOLDOWN_STATE VARIABLE=skip VALUE=1
    M117 Skipping cooldown...
  {% else %}
    {action_respond_info("No cooldown running.")}
  {% endif %}
[gcode_macro COOLDOWN]
description: Cool down bed/chamber async. Does not block the print.
gcode:
  {% set filament = params.FILAMENT %}
  {% if printer.heater_bed.temperature > 35 %}
    {% if filament in ['PETG', 'PLA'] %}
      M117 Cooling down for {filament}...
      SET_HEATER_TEMPERATURE HEATER=chamber TARGET=0
      SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0
      SET_FAN_SPEED FAN=chamber_circulation_fan SPEED=1
      SET_FAN_SPEED FAN=auxiliary_cooling_fan SPEED=1

      SET_GCODE_VARIABLE MACRO=_COOLDOWN_STATE VARIABLE=filament VALUE='"{filament}"'
      SET_GCODE_VARIABLE MACRO=_COOLDOWN_STATE VARIABLE=target VALUE=35
      SET_GCODE_VARIABLE MACRO=_COOLDOWN_STATE VARIABLE=phase VALUE='"wait_target"'
      SET_GCODE_VARIABLE MACRO=_COOLDOWN_STATE VARIABLE=skip VALUE=0
      SET_GCODE_VARIABLE MACRO=_COOLDOWN_STATE VARIABLE=active VALUE=1
      UPDATE_DELAYED_GCODE ID=_COOLDOWN_POLL DURATION=1

    {% elif filament in ['ASA', 'ABS'] %}
      M117 Controlled cooldown for {filament}...
      {% set chamber_temp = printer['heater_generic chamber'].temperature | round(0) | int %}
      SET_FAN_SPEED FAN=chamber_circulation_fan SPEED=0.3
      SET_FAN_SPEED FAN=auxiliary_cooling_fan SPEED=1
      SET_HEATER_TEMPERATURE HEATER=chamber TARGET={chamber_temp - 3}
      SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0

      SET_GCODE_VARIABLE MACRO=_COOLDOWN_STATE VARIABLE=filament VALUE='"{filament}"'
      SET_GCODE_VARIABLE MACRO=_COOLDOWN_STATE VARIABLE=target VALUE=40
      SET_GCODE_VARIABLE MACRO=_COOLDOWN_STATE VARIABLE=chamber_temp VALUE={chamber_temp}
      SET_GCODE_VARIABLE MACRO=_COOLDOWN_STATE VARIABLE=phase VALUE='"wait_match"'
      SET_GCODE_VARIABLE MACRO=_COOLDOWN_STATE VARIABLE=skip VALUE=0
      SET_GCODE_VARIABLE MACRO=_COOLDOWN_STATE VARIABLE=active VALUE=1
      UPDATE_DELAYED_GCODE ID=_COOLDOWN_POLL DURATION=1

    {% else %}
      M117 COOLDOWN doesn't support {filament}. Turning off heaters.
      SET_HEATER_TEMPERATURE HEATER=chamber TARGET=0
      SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0
      SET_FAN_SPEED FAN=chamber_circulation_fan SPEED=0
      SET_FAN_SPEED FAN=auxiliary_cooling_fan SPEED=0
    {% endif %}
  {% else %}
    M117 Bed already cool. Skipping cooldown.
    {action_respond_info("Bed temperature is at or below 35C, cooldown skipped.")}
    SET_FAN_SPEED FAN=chamber_circulation_fan SPEED=0
    SET_FAN_SPEED FAN=auxiliary_cooling_fan SPEED=0
  {% endif %}
[delayed_gcode _COOLDOWN_POLL]
gcode:
  {% set state = printer["gcode_macro _COOLDOWN_STATE"] %}
  {% set bed = printer.heater_bed.temperature %}
  {% if not state.active %}
    M117
  {% elif state.skip %}
    M117 Cooldown skipped.
    _COOLDOWN_FINISH SKIPPED=1
  {% elif state.phase == "wait_match" %}
    {% if bed <= state.chamber_temp %}
      M117 Bed at chamber temp. Starting exhaust.
      SET_FAN_SPEED FAN=chamber_circulation_fan SPEED=0.8
      SET_HEATER_TEMPERATURE HEATER=chamber TARGET=0
      SET_GCODE_VARIABLE MACRO=_COOLDOWN_STATE VARIABLE=phase VALUE='"wait_target"'
    {% endif %}
    UPDATE_DELAYED_GCODE ID=_COOLDOWN_POLL DURATION=5
  {% elif state.phase == "wait_target" %}
    {% if bed <= state.target %}
      M117 Bed is cool. Print can be removed.
      _COOLDOWN_FINISH SKIPPED=0
    {% else %}
      UPDATE_DELAYED_GCODE ID=_COOLDOWN_POLL DURATION=5
    {% endif %}
  {% endif %}
[gcode_macro _COOLDOWN_FINISH]
gcode:
  {% set skipped = params.SKIPPED|default(0)|int %}
  {% set state = printer["gcode_macro _COOLDOWN_STATE"] %}
  SET_HEATER_TEMPERATURE HEATER=chamber TARGET=0
  SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0
  SET_FAN_SPEED FAN=chamber_circulation_fan SPEED=0
  SET_FAN_SPEED FAN=auxiliary_cooling_fan SPEED=0
  {% if skipped %}
    _SEND_NOTIFICATION MESSAGE="Cooldown skipped for {state.filament}."
  {% else %}
    _SEND_NOTIFICATION MESSAGE="Print cooldown complete for {state.filament}. The bed has reached {state.target}°C."
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_COOLDOWN_STATE VARIABLE=active VALUE=0
  SET_GCODE_VARIABLE MACRO=_COOLDOWN_STATE VARIABLE=skip VALUE=0
  SET_GCODE_VARIABLE MACRO=_COOLDOWN_STATE VARIABLE=phase VALUE='""'
