[gcode_macro PRINT_START]
gcode:
    SKIP_COOLDOWN
    AUTOTUNE_SHAPERS
    DISABLE_ALL_SENSOR
    CLEAR_PAUSE
    
    {% set bedtemp = params.get('BED') | int %}
    {% set hotendtemp = params.get('HOTEND') | int %}
    {% set chambertemp = params.get('CHAMBER', 0) | int %}
    {% set extruder = params.EXTRUDER|default(0)|int %}

    # Start bed + chamber heating immediately so they soak during home/clean/level/mesh
    M140 S{bedtemp}
    M141 S{chambertemp}

    M104 S0
    {% if chambertemp == 0 %}
        M106 P3 S255
    {% endif %}
    G28
    SET_GCODE_OFFSET Z=0 MOVE=0
    # QIDI-box print-start block removed (BUFFER_MONITORING / BOX_PRINT_START /
    # box save-variables are vendor-only; Happy-Hare manages the MMU).

    CLEAR_NOZZLE HOTEND={hotendtemp}
    #切料调平
    # CUT_FILAMENT_1
    M104 S140
    G4 P3000
    M400
    G28    
    Z_TILT_ADJUST
    

    M104 S140
    M190 S{bedtemp}   
    M191 S{chambertemp}
    M400
    G4 P3000
    
    # G29
    BED_MESH_CALIBRATE
    G0 Z50 F600
    G0 X260 Y5  F30000
    # box_extras BUFFER_MONITORING block removed (vendor-only).
    # SMART_PARK (KAMP) — KAMP is not included in this config; commented out.
    # SMART_PARK
    M191 S{chambertemp}
    M109 S{hotendtemp}
    M204 S10000

    set_zoffset
    ENABLE_ALL_SENSOR
    # save_last_file removed (QIDI vendor-only macro).

    SKEW_PROFILE LOAD=Calilantern
[gcode_macro ENABLE_ALL_SENSOR]
gcode:
    SET_FILAMENT_SENSOR SENSOR=filament_switch_sensor ENABLE=1
[gcode_macro DISABLE_ALL_SENSOR]
gcode:
    SET_FILAMENT_SENSOR SENSOR=filament_switch_sensor ENABLE=0
